name: FKernel CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    name: Build FKernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang clang-format clang-tidy nasm qemu-system-x86 qemu-utils build-essential lua5.4 ninja-build xorriso mtools grub-common grub-pc-bin
        sudo ln -sf /usr/bin/lua5.4 /usr/bin/lua

    - name: Install xmake
      run: |
        curl -fsSL https://xmake.io/shget.text | bash
        export PATH=$HOME/.xmake/bin:$PATH
        source ~/.xmake/profile
        xmake --version

    - name: Build kernel
      run: |
        export PATH=$HOME/.xmake/bin:$PATH
        xmake -bv FKernel

  layer-check:
    name: Layer Separation Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.4
        sudo ln -sf /usr/bin/lua5.4 /usr/bin/lua

    - name: Install xmake
      run: |
        curl -fsSL https://xmake.io/shget.text | bash
        export PATH=$HOME/.xmake/bin:$PATH
        source ~/.xmake/profile

    - name: Run layer check
      run: |
        export PATH=$HOME/.xmake/bin:$PATH
        xmake check-layers

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang

    - name: Install xmake
      run: |
        curl -fsSL https://xmake.io/shget.text | bash
        export PATH=$HOME/.xmake/bin:$PATH
        source ~/.xmake/profile

    - name: Build and run tests
      run: |
        export PATH=$HOME/.xmake/bin:$PATH
        xmake -bv Test
        xmake run Test

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang clang-format clang-tidy

    - name: Check code formatting
      run: |
        echo "Checking clang-format compliance..."
        find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.c" | \
          xargs clang-format --dry-run --Werror

    - name: Run clang-tidy
      run: |
        echo "Running clang-tidy..."
        find Src/ Include/ -name "*.cpp" -o -name "*.c" | \
          head -10 | \
          xargs -I {} clang-tidy --config-file=.clang-tidy {} --quiet

  object-calisthenics:
    name: Object Calisthenics Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check class size limits
      run: |
        echo "Checking Object Calisthenics compliance..."

        echo "📏 Checking for classes >200 lines..."
        large_files=$(find Src/ -name "*.cpp" -exec wc -l {} + | awk '$1 > 200 {print $2}' | wc -l)
        if [ "$large_files" -gt 0 ]; then
          echo "❌ Found files >200 lines:"
          find Src/ -name "*.cpp" -exec wc -l {} + | awk '$1 > 200 {print $1 " lines in " $2}'
          exit 1
        fi
        echo "✅ All files are ≤200 lines"

        echo "🚫 Checking for 'else' violations..."
        else_count=$(find Src/ -name "*.cpp" -exec grep -c "else" {} + | awk '{sum += $1} END {print sum}')
        if [ "$else_count" -gt 50 ]; then
          echo "❌ Found $else_count 'else' statements (threshold: 50)"
          echo "Use early returns instead of else blocks"
          exit 1
        fi
        echo "✅ 'else' count acceptable: $else_count"

        echo "⚡ Checking for one-dot-per-line violations..."
        chain_calls=$(find Src/ -name "*.cpp" -exec grep -n "\->.*\->" {} + | wc -l)
        if [ "$chain_calls" -gt 10 ]; then
          echo "❌ Found $chain_calls chained method calls (threshold: 10)"
          echo "Use delegation instead of chaining"
          exit 1
        fi
        echo "✅ Chained calls acceptable: $chain_calls"

  hardware-compatibility:
    name: Hardware Compatibility Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for hardcoded values
      run: |
        echo "🔍 Checking for hardcoded hardware values..."

        if grep -q "dd [1-9][0-9]*.*dd [1-9][0-9]*" Src/Kernel/Arch/x86_64/Section/multiboot2.asm; then
          if grep -q "dd 0.*dd 0" Src/Kernel/Arch/x86_64/Section/multiboot2.asm; then
            echo "✅ Using auto-detection for framebuffer resolution"
          else
            echo "❌ Found hardcoded framebuffer resolution in multiboot2.asm"
            echo "Use 0 for auto-detection"
            exit 1
          fi
        fi

        magic_numbers=$(find Src/Kernel/Driver -name "*.cpp" -exec grep -n "0x[0-9A-Fa-f]\{4,\}" {} + | wc -l)
        echo "Found $magic_numbers potential hardware magic numbers (review needed)"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run basic security checks
      run: |
        echo "🔒 Running security analysis..."

        unsafe_funcs=$(find Src/ -name "*.cpp" -o -name "*.c" | xargs grep -l "strcpy\|strcat\|sprintf" | wc -l)
        if [ "$unsafe_funcs" -gt 0 ]; then
          echo "⚠️  Found potential unsafe string functions:"
          find Src/ -name "*.cpp" -o -name "*.c" | xargs grep -n "strcpy\|strcat\|sprintf" || true
          echo "Consider using safer alternatives (strncpy, strncat, snprintf)"
        fi

        echo "Checking for potentially unchecked return values..."
        unchecked_returns=$(find Src/ -name "*.cpp" | xargs grep -c "=.*malloc\|\.allocate\|\.create" | awk '{sum += $2} END {print sum}')
        echo "Found $unchecked_returns allocation calls that should be checked"
